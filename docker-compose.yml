# Local demo stack: PostgreSQL, Redis, API, Celery workers (media + ops/beat), Next.js; private file volume.
# `docker compose up --build` runs migrations and loads the demo data without any external secrets.
name: nap-store

x-backend-env: &backend-env
  NAP_ENV: ${NAP_ENV:-demo}
  NAP_DATABASE_URL: postgresql+psycopg://nap:${POSTGRES_PASSWORD:-nap}@postgres:5432/nap
  NAP_REDIS_URL: redis://redis:6379/0
  NAP_SECRET_KEY: ${NAP_SECRET_KEY:-dev-change-me-local-only}
  # demo: private volume shared by api/workers, files served only through short-lived signed API links.
  # NAP-004: private S3 bucket — COMPOSE_PROFILES=s3 + NAP_STORAGE_BACKEND=s3 (bundled SeaweedFS), or an external
  # S3 service via NAP_S3_ENDPOINT_URL. Moving existing files: docs/operations.md, "Хранилище файлов".
  NAP_STORAGE_BACKEND: ${NAP_STORAGE_BACKEND:-local}
  NAP_STORAGE_ROOT: /app/var/storage
  NAP_S3_ENDPOINT_URL: ${NAP_S3_ENDPOINT_URL:-http://s3:8333}
  NAP_S3_BUCKET: ${NAP_S3_BUCKET:-nap-private}
  NAP_S3_REGION: ${NAP_S3_REGION:-us-east-1}
  NAP_S3_ACCESS_KEY: ${NAP_S3_ACCESS_KEY:-nap-local-access}
  NAP_S3_SECRET_KEY: ${NAP_S3_SECRET_KEY:-nap-local-secret-change-me}
  NAP_PUBLIC_BASE_URL: ${NAP_PUBLIC_BASE_URL:-http://localhost:3000}
  NAP_PAYMENT_PROVIDER: ${NAP_PAYMENT_PROVIDER:-mock}
  NAP_STRIPE_SECRET_KEY: ${NAP_STRIPE_SECRET_KEY:-}
  NAP_STRIPE_WEBHOOK_SECRET: ${NAP_STRIPE_WEBHOOK_SECRET:-}
  NAP_SHIPPING_ADAPTER: ${NAP_SHIPPING_ADAPTER:-mock}
  NAP_EASYPOST_API_KEY: ${NAP_EASYPOST_API_KEY:-}
  NAP_EASYPOST_WEBHOOK_SECRET: ${NAP_EASYPOST_WEBHOOK_SECRET:-}
  NAP_JOB_WORKDIR: /app/var/jobs
  # e-mail (NAP-007): log (default) / file (/app/var/mail/*.eml) / smtp with NAP_SMTP_* below
  NAP_EMAIL_BACKEND: ${NAP_EMAIL_BACKEND:-log}
  NAP_EMAIL_FROM: ${NAP_EMAIL_FROM:-NAP Store <no-reply@nap.local>}
  NAP_EMAIL_FILE_DIR: /app/var/mail
  NAP_SMTP_HOST: ${NAP_SMTP_HOST:-}
  NAP_SMTP_PORT: ${NAP_SMTP_PORT:-587}
  NAP_SMTP_USER: ${NAP_SMTP_USER:-}
  NAP_SMTP_PASSWORD: ${NAP_SMTP_PASSWORD:-}
  NAP_SMTP_SECURITY: ${NAP_SMTP_SECURITY:-starttls}
  NAP_BUILD: ${NAP_BUILD:-docker}

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: nap, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nap}", POSTGRES_DB: nap }
    volumes: [pgdata:/var/lib/postgresql/data, ./backups:/backups]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nap"], interval: 5s, retries: 20 }
    networks: [core]

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
    networks: [core]

  migrate:
    build: ./backend
    environment: *backend-env
    command: sh -c "alembic upgrade head && python -m app.seed"
    depends_on:
      postgres: { condition: service_healthy }
    volumes: [storage:/app/var/storage]
    networks: [core]

  api:
    build: ./backend
    environment: *backend-env
    ports: ["8000:8000"]
    volumes: [storage:/app/var/storage, ./backups:/backups:ro]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/ready')"], interval: 10s, retries: 10 }
    networks: [core, edge]

  worker-media:
    build: ./backend
    environment: *backend-env
    command: celery -A app.worker.celery worker -Q media --concurrency 2 --loglevel INFO
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    # conversions only: CPU/memory limits, internal network only (no arbitrary egress)
    deploy: { resources: { limits: { cpus: "2", memory: 3g } } }
    volumes: [jobs:/app/var/jobs, storage:/app/var/storage]
    networks: [core]

  worker-ops:
    build: ./backend
    environment: *backend-env
    # beat + inbox/outbox/reconciliation; needs egress for Stripe/EasyPost when configured
    command: celery -A app.worker.celery worker -B -Q ops --concurrency 2 --loglevel INFO
    volumes: [storage:/app/var/storage]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    networks: [core, edge]

  # NAP-006: daily pg_dump + restore check into a scratch DB + retention; status in ./backups/last-status.json
  backup:
    image: postgres:16-bookworm
    environment:
      PG_URL: postgresql://nap:${POSTGRES_PASSWORD:-nap}@postgres:5432/nap
      PG_ADMIN_URL: postgresql://nap:${POSTGRES_PASSWORD:-nap}@postgres:5432/postgres
      BACKUP_DIR: /backups
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_STORAGE_DIR: /storage
      BACKUP_S3_DATA_DIR: /s3data  # bundled SeaweedFS data (profile s3); empty otherwise and then skipped
    entrypoint: ["bash", "/ops/backup-loop.sh"]
    volumes: [./ops:/ops:ro, ./backups:/backups, storage:/storage:ro, s3data:/s3data:ro]
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [core]

  # NAP-004: bundled private S3 storage (SeaweedFS, Apache-2.0) — profile `s3`. Internal network only: no port is
  # published, so the bucket is reachable from the API and workers alone. Anonymous access is off (identity below).
  s3:
    image: chrislusf/seaweedfs:4.45
    profiles: [s3]
    environment:
      S3_ACCESS_KEY: ${NAP_S3_ACCESS_KEY:-nap-local-access}
      S3_SECRET_KEY: ${NAP_S3_SECRET_KEY:-nap-local-secret-change-me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"nap","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip=s3 -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes: [s3data:/data]
    networks: [core]

  # NAP-005: optional monitoring — `docker compose --profile monitoring up -d`; Prometheus UI on 127.0.0.1:9090.
  # Alert e-mails: fill ops/monitoring/alertmanager.yml (placeholders) first.
  prometheus:
    image: prom/prometheus:v2.53.2
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes: [./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,
              ./ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro, promdata:/prometheus]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api]
    networks: [core, edge]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [monitoring]
    volumes: [./ops/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    networks: [core, edge]

  web:
    build: { context: ./frontend, args: { BACKEND_URL: "http://api:8000" } }
    environment: { BACKEND_URL: "http://api:8000", PUBLIC_BASE_URL: "${NAP_PUBLIC_BASE_URL:-http://localhost:3000}" }
    ports: ["3000:3000"]
    depends_on: { api: { condition: service_healthy } }
    networks: [edge]

networks:
  core: { internal: true }
  edge: {}

volumes: { pgdata: {}, storage: {}, jobs: {}, promdata: {}, s3data: {} }
