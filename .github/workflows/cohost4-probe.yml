name: cohost4-isolated-probe
on:
  pull_request:
    paths: ['ops/cohost4/**', '.github/workflows/cohost4-probe.yml']
permissions:
  contents: read
concurrency:
  group: cohost4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Disposable runner only, synthetic DB and audio
        run: python3 ops/cohost4/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cohost4-evidence
          path: |
            cohost4-report/result.json
            cohost4-report/samples.json
