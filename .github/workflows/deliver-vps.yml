# NAP-087: continuous delivery to the dedicated store server.
# Green CI on current master -> build backend/web images once (layer cache) -> push to GHCR by digest ->
# SSH to the server with a key that can only run ops/vps/napdeploy.py -> migrate, switch, readiness check,
# automatic return to the previous release on failure. Nothing is built on the server.
# The deploy job runs only when the variable STORE_DEPLOY_HOST is set. Optional manual approval:
# Settings -> Environments -> production -> Required reviewers.
name: deliver-vps
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to (re)deploy; empty = current master (must have green CI)"
        required: false
permissions:
  contents: read
concurrency:
  group: store-vps-delivery
  cancel-in-progress: false
jobs:
  images:
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == 'BrothersB/nap-store')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
      sha: ${{ steps.gate.outputs.sha }}
      backend: ${{ steps.backend.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
    steps:
      - name: Pick the commit (current master, green CI only)
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const {data: master} = await github.rest.repos.getBranch({...context.repo, branch: 'master'});
            let sha = context.eventName === 'workflow_run' ? context.payload.workflow_run.head_sha
                    : (context.payload.inputs?.sha || master.commit.sha);
            if (!/^[0-9a-f]{40}$/.test(sha)) core.setFailed('bad sha');
            if (context.eventName === 'workflow_run' && sha !== master.commit.sha) {
              core.notice(`skip: ${sha} is no longer master`); core.setOutput('go', 'no'); return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
              {...context.repo, head_sha: sha, per_page: 100});
            const ok = runs.some(r => r.name === 'ci' && r.conclusion === 'success');
            if (!ok) { core.setFailed(`no green ci run for ${sha}`); return; }
            core.setOutput('go', 'yes'); core.setOutput('sha', sha);
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'
        with: { ref: "${{ steps.gate.outputs.sha }}", persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.go == 'yes'
      - uses: docker/login-action@v3
        if: steps.gate.outputs.go == 'yes'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: backend image
        id: backend
        if: steps.gate.outputs.go == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          provenance: false
          tags: ghcr.io/brothersb/nap-store-backend:${{ steps.gate.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: web image
        id: web
        if: steps.gate.outputs.go == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          provenance: false
          build-args: BACKEND_URL=http://api:8000
          tags: ghcr.io/brothersb/nap-store-web:${{ steps.gate.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: images
    if: needs.images.outputs.go == 'yes' && vars.STORE_DEPLOY_HOST != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.images.outputs.sha }}", persist-credentials: false }
      - name: Deploy on the store server
        env:
          SSH_KEY: ${{ secrets.STORE_DEPLOY_SSH_KEY }}
          HOST: ${{ vars.STORE_DEPLOY_HOST }}
          HOST_KEY: ${{ vars.STORE_DEPLOY_HOST_KEY }}
          SHA: ${{ needs.images.outputs.sha }}
          BACKEND: ${{ needs.images.outputs.backend }}
          WEB: ${{ needs.images.outputs.web }}
          PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_USER: ${{ github.actor }}
        run: python3 ops/vps/ci_deploy.py deploy
