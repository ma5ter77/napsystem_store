# NAP-097: the store server is Arm (Hetzner CAX, Ampere). deliver-vps builds amd64 + arm64 only after merge, so
# any pull request that can change the images builds them for arm64 here (QEMU, no push) and smoke-tests them:
# Python imports of the native modules, ffmpeg and pg_dump in the backend image, the Next.js server in web.
name: arm64-build
on:
  pull_request:
    paths:
      - backend/Dockerfile
      - backend/pyproject.toml
      - backend/uv.lock
      - frontend/Dockerfile
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/deliver-vps.yml
      - .github/workflows/arm64-build.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arm64-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - name: backend image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          load: true
          tags: nap-backend:arm64
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend-arm64-check,mode=max
      - name: web image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/arm64
          load: true
          build-args: BACKEND_URL=http://api:8000
          tags: nap-web:arm64
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web-arm64-check,mode=max
      - name: smoke test under arm64
        run: |
          set -e
          docker run --rm --platform linux/arm64 nap-backend:arm64 uname -m | grep -qx aarch64
          docker run --rm --platform linux/arm64 -e NAP_SECRET_KEY=ci-arm64-smoke nap-backend:arm64 \
            python -c "import numpy, psycopg, sqlalchemy; import app.main, app.audio.render, app.worker; print('backend imports ok')"
          docker run --rm --platform linux/arm64 --entrypoint ffmpeg nap-backend:arm64 -hide_banner -version | head -1
          # the converter and the studio resample with ffmpeg's soxr engine: it must exist in the arm64 build
          docker run --rm --platform linux/arm64 --entrypoint ffmpeg nap-backend:arm64 -hide_banner -v error \
            -f lavfi -i sine=frequency=1000:sample_rate=44100:duration=0.2 -af aresample=48000:resampler=soxr:precision=28 -f null -
          # a real studio render on arm64: binaural pair -> verified 24-bit WAV, beat frequency measured
          docker run --rm --platform linux/arm64 -e NAP_SECRET_KEY=ci-arm64-smoke -w /tmp nap-backend:arm64 python -c "
          import sys; sys.path.insert(0, '/app')
          from app.audio.render import render, verify
          from app.dsp.engine import measure_tone
          import numpy as np, wave
          fs = 48000; n = 2 * fs
          g = {'id': 'g1', 'type': 'binaural', 'params': {'carrier_hz': 200, 'delta_hz': 8, 'amplitude_dbfs': -12}}
          st = {'tracks': [{'id': 't1', 'bus': 'NEURO_LEFT', 'clips': [{'id': 'c1', 'generator_id': 'g1', 'generator_output': 'left', 'start_frame': 0, 'duration_frames': n}]},
                           {'id': 't2', 'bus': 'NEURO_RIGHT', 'clips': [{'id': 'c2', 'generator_id': 'g1', 'generator_output': 'right', 'start_frame': 0, 'duration_frames': n}]}],
                'generators': [g], 'output': {'on_clip': 'fail'}}
          r = render(st, fs=fs, bits=24, profile_key='HEADPHONES_2_0', sources={}, out_path='/tmp/a.wav')
          assert verify(r.path, r)['passed']
          raw = wave.open(r.path).readframes(n); b = np.frombuffer(raw, np.uint8).reshape(-1, 3).astype(np.int32)
          x = (b[:, 0] | b[:, 1] << 8 | b[:, 2] << 16); x = np.where(x >= 1 << 23, x - (1 << 24), x).reshape(-1, 2) / 2.0**23
          fl, _ = measure_tone(x[fs // 2:, 0], fs, 196); fr, _ = measure_tone(x[fs // 2:, 1], fs, 204)
          assert abs((fr - fl) - 8) < 0.01, (fl, fr)
          print('arm64 studio render ok:', round(fl, 4), round(fr, 4), r.report['sha256'][:12])
          "
          docker run --rm --platform linux/arm64 --entrypoint pg_dump nap-backend:arm64 --version
          docker run --rm --platform linux/arm64 --entrypoint node nap-web:arm64 -e "console.log(process.arch)" | grep -qx arm64
          docker run -d --name web --platform linux/arm64 -p 3999:3000 nap-web:arm64
          for i in $(seq 1 60); do curl -s -o /dev/null -w '%{http_code}' localhost:3999/ru | grep -qE '^[2-5][0-9][0-9]$' && break; sleep 3; done
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:3999/ru); echo "web /ru -> $code (no API behind it; any HTTP answer proves the server runs)"
          docker logs web | tail -5
          [ "$code" != "000" ]
