# NAP-003: every push and pull request runs backend tests, frontend checks and build, browser E2E (RU/EN)
# and the Docker image build. Make the "ci-ok" job a required status check in the branch protection rules
# so a pull request cannot be merged while CI is red.
name: ci

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # superseded pull request runs are cancelled; master runs are not, since they end with a deploy to the server
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NAP_DATABASE_URL: postgresql+psycopg://nap:nap@localhost:5432/nap
  NAP_REDIS_URL: redis://localhost:6379/0
  NAP_SECRET_KEY: ci-only-secret
  UV_VERSION: "0.11.32"
  NODE_VERSION: "22"
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  release-safety:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: python3 ops/release.py --check
      - run: python3 ops/cohost/test_release_control.py
      - run: python3 ops/automation/test_receive.py
      - run: python3 ops/vps/test_napdeploy.py
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node ops/automation/test-auto-merge.cjs
      - run: bash -n ops/cohost/deploy-cohost.sh ops/cohost/rollback-cohost.sh

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nap, POSTGRES_PASSWORD: nap, POSTGRES_DB: nap_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nap" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv sync --frozen
      - name: pytest
        env: { NAP_DATABASE_URL: "postgresql+psycopg://nap:nap@localhost:5432/nap_test" }
        run: uv run pytest -q --junitxml=../reports/backend-junit.xml
      - name: migrations match models
        env: { NAP_DATABASE_URL: "postgresql+psycopg://nap:nap@localhost:5432/nap_test" }
        run: uv run alembic upgrade head && uv run alembic check
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-report, path: reports/ }

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run check-i18n
      - run: npm run check-patterns
      - run: npm run typecheck
      - run: npm run test-studio
      - run: npm run build
        env: { BACKEND_URL: "http://127.0.0.1:8000" }

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nap, POSTGRES_PASSWORD: nap, POSTGRES_DB: nap }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nap" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NAP_STORAGE_ROOT: ${{ github.workspace }}/var/storage
      NAP_JOB_WORKDIR: ${{ github.workspace }}/var/jobs
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: backend up (migrations, demo data, API, workers)
        working-directory: backend
        run: |
          uv sync --frozen --no-dev
          uv run alembic upgrade head
          uv run python -m app.seed
          nohup uv run uvicorn app.main:app --port 8000 > ../reports-api.log 2>&1 &
          nohup uv run celery -A app.worker.celery worker -B -Q media,ops -c 2 > ../reports-worker.log 2>&1 &
      - name: frontend up
        working-directory: frontend
        env: { BACKEND_URL: "http://127.0.0.1:8000" }
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > ../reports-web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3000/ru >/dev/null && curl -sf localhost:8000/api/v1/ready && break; sleep 2; done
      - name: browser E2E (RU and EN)
        working-directory: frontend
        env: { SHOTS: "${{ github.workspace }}/e2e-shots" }
        run: |
          npm i --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
          npx playwright install --with-deps chromium
          node e2e/flows.cjs | tee ../e2e-run.txt
          grep -q '"ru":"passed","en":"passed"' ../e2e-run.txt
          # NAP-100: Audio Studio — upload, edit, preview, verified 5.1 export, axe on the editor
          node e2e/studio.cjs | tee -a ../e2e-run.txt
          grep -q '"studio":"passed"' ../e2e-run.txt
          # NAP-104: protected copy for listening without the internet — save, play with the network off, revoke
          node e2e/offline.cjs | tee -a ../e2e-run.txt
          grep -q '"offline":"passed"' ../e2e-run.txt
          # NAP-043: WCAG 2.1 AA (axe-core) on every page/role + keyboard checks; fails on serious/critical issues
          node e2e/a11y.cjs --json ../a11y-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e-run.txt
            a11y-report.json
            e2e-shots/
            reports-*.log

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: monitoring config is valid (promtool, amtool)
        run: |
          docker run --rm -v "$PWD/ops/monitoring:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v2.53.2 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/ops/monitoring:/etc/am:ro" --entrypoint amtool prom/alertmanager:v0.27.0 check-config /etc/am/alertmanager.yml
      - run: docker compose config -q && docker compose -f docker-compose.yml -f ops/cohost/docker-compose.cohost.yml config -q && docker compose build
      - name: stack starts and is ready
        run: |
          docker compose up -d
          for i in $(seq 1 60); do curl -sf localhost:8000/api/v1/ready && curl -sf localhost:3000/ru >/dev/null && break; sleep 5; done
          curl -sf localhost:8000/api/v1/ready || { docker compose ps; docker compose logs --tail 200; exit 1; }
          # NAP-006: one manual backup cycle inside the backup service must succeed
          docker compose exec -T -e BACKUP_ONCE=1 backup bash /ops/backup-loop.sh && grep -q '"status":"ok"' backups/last-status.json || { cat backups/last-status.json; docker compose logs --tail 100 backup; exit 1; }
      - name: switch to the private S3 bucket and move the files (NAP-004)
        env: { COMPOSE_PROFILES: s3, NAP_STORAGE_BACKEND: s3 }
        run: |
          # same volumes: the demo files written to the local volume above must arrive in the bucket
          docker compose up -d
          for i in $(seq 1 60); do curl -sf localhost:8000/api/v1/ready && break; sleep 5; done
          curl -sf localhost:8000/api/v1/ready || { docker compose ps; docker compose logs --tail 200 s3 api; exit 1; }
          docker compose exec -T api python -m app.tools.storage migrate --from /app/var/storage
          docker compose exec -T api python -m app.tools.storage check
          # the bucket server publishes no port: nothing on the host answers S3 requests
          ! curl -s -m 3 localhost:8333 >/dev/null
          docker compose exec -T -e BACKUP_ONCE=1 backup bash /ops/backup-loop.sh && ls backups/storage-s3-*.tar
      - if: always()
        run: docker compose down -v

  ci-ok:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, e2e, docker, release-safety]
    if: always()
    steps:
      - run: test "${{ needs.backend.result }}${{ needs.frontend.result }}${{ needs.e2e.result }}${{ needs.docker.result }}${{ needs.release-safety.result }}" = "successsuccesssuccesssuccesssuccess"

  # NAP-097: green master -> the store server. Called from here because the auto-accept bot merges and starts
  # this run with GITHUB_TOKEN, and GitHub does not start workflow_run listeners from such runs (the old
  # trigger never fired). Pull requests never deploy.
  deliver:
    needs: [ci-ok]
    if: >-
      github.ref == 'refs/heads/master' && github.event_name != 'pull_request' &&
      github.repository == 'ma5ter77/napsystem_store'
    permissions: { contents: read, packages: write, actions: read }
    uses: ./.github/workflows/deliver-vps.yml
    with: { from_ci: true }
    secrets: inherit
