name: auto-accept-ma5ter77
on:
  workflow_run:
    workflows: [ci, release-acceptance, vps-acceptance]
    types: [completed]
  pull_request_target:
    types: [ready_for_review, reopened]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: store-auto-accept
  cancel-in-progress: false
jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./ops/automation/auto-merge.cjs')({github, context, core});
