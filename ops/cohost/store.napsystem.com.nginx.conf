# NAP-085: nginx site for store.napsystem.com — a separate file, the main site's server blocks are not touched.
# INACTIVE EXAMPLE: not applied. The platform's nginx layout, ports and TLS setup must be checked on the server
# first and the change agreed with the owner (BrothersB) before anything is installed.
# Install:  cp store.napsystem.com.nginx.conf /etc/nginx/sites-available/store.napsystem.com
#           ln -s /etc/nginx/sites-available/store.napsystem.com /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
#           certbot --nginx -d store.napsystem.com      # adds the 443 block and the certificate
# Rollback: rm /etc/nginx/sites-enabled/store.napsystem.com && nginx -t && systemctl reload nginx
# STORE_WEB_PORT below must match .env (default 3100).

server {
    listen 80;
    listen [::]:80;
    server_name store.napsystem.com;

    # uploads go in 8 MB chunks; a little headroom
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;   # audio streaming with Range requests
    }

    # monitoring endpoints stay internal
    location ~ ^/api/v1/(metrics)$ { return 404; }
}
