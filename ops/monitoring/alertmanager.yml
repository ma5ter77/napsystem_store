# Alert delivery by e-mail through the same SMTP provider as the platform.
# Fill in the placeholders (or mount your own file) before enabling the monitoring profile in production.
route:
  receiver: ops-email
  group_by: [alertname]
  group_wait: 1m
  repeat_interval: 4h
receivers:
  - name: ops-email
    email_configs:
      - to: ALERT_EMAIL_TO
        from: ALERT_EMAIL_FROM
        smarthost: SMTP_HOST:SMTP_PORT
        auth_username: SMTP_USER
        auth_password: SMTP_PASSWORD
        require_tls: true
        send_resolved: true
