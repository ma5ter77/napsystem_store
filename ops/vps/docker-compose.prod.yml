# NAP-087: production stack for the dedicated store server (store.napsystem.com).
# Images are built by GitHub Actions and pulled by digest; nothing is built on the server.
# Started only by ops/vps/napdeploy.py with two env files:
#   ${STORE_ROOT}/shared/.env            — secrets, created on the server by bootstrap.sh (never leaves it)
#   ${STORE_ROOT}/releases/<sha>/release.env — IMAGE_BACKEND, IMAGE_WEB, NAP_BUILD, STORE_ROOT (written by the deployer)
# Memory caps are sized for a 4 GiB / 2 vCPU server (+2 GiB swap). Only Caddy publishes ports (80/443).

x-backend-env: &backend-env
  NAP_ENV: ${NAP_ENV:-demo}
  NAP_DATABASE_URL: postgresql+psycopg://nap:${POSTGRES_PASSWORD:?set in shared/.env}@postgres:5432/nap
  NAP_REDIS_URL: redis://redis:6379/0
  NAP_SECRET_KEY: ${NAP_SECRET_KEY:?set in shared/.env}
  NAP_STORAGE_BACKEND: ${NAP_STORAGE_BACKEND:-local}
  NAP_STORAGE_ROOT: /app/var/storage
  NAP_S3_ENDPOINT_URL: ${NAP_S3_ENDPOINT_URL:-}
  NAP_S3_BUCKET: ${NAP_S3_BUCKET:-nap-private}
  NAP_S3_REGION: ${NAP_S3_REGION:-us-east-1}
  NAP_S3_ACCESS_KEY: ${NAP_S3_ACCESS_KEY:-}
  NAP_S3_SECRET_KEY: ${NAP_S3_SECRET_KEY:-}
  NAP_PUBLIC_BASE_URL: https://${STORE_DOMAIN:-store.napsystem.com}
  NAP_COOKIE_SECURE: "true"
  NAP_PAYMENT_PROVIDER: ${NAP_PAYMENT_PROVIDER:-mock}
  NAP_STRIPE_SECRET_KEY: ${NAP_STRIPE_SECRET_KEY:-}
  NAP_STRIPE_WEBHOOK_SECRET: ${NAP_STRIPE_WEBHOOK_SECRET:-}
  NAP_SHIPPING_ADAPTER: ${NAP_SHIPPING_ADAPTER:-mock}
  NAP_EASYPOST_API_KEY: ${NAP_EASYPOST_API_KEY:-}
  NAP_EASYPOST_WEBHOOK_SECRET: ${NAP_EASYPOST_WEBHOOK_SECRET:-}
  NAP_JOB_WORKDIR: /app/var/jobs
  NAP_EMAIL_BACKEND: ${NAP_EMAIL_BACKEND:-log}
  NAP_EMAIL_FROM: ${NAP_EMAIL_FROM:-NAP Store <no-reply@store.napsystem.com>}
  NAP_EMAIL_FILE_DIR: /app/var/mail
  NAP_SMTP_HOST: ${NAP_SMTP_HOST:-}
  NAP_SMTP_PORT: ${NAP_SMTP_PORT:-587}
  NAP_SMTP_USER: ${NAP_SMTP_USER:-}
  NAP_SMTP_PASSWORD: ${NAP_SMTP_PASSWORD:-}
  NAP_SMTP_SECURITY: ${NAP_SMTP_SECURITY:-starttls}
  NAP_BUILD: ${NAP_BUILD:?written by the deployer}
  NAP_API_WORKERS: ${NAP_API_WORKERS:-2}
  NAP_CURRENCIES: '${NAP_CURRENCIES:-["EUR","USD"]}'
  NAP_SEED_DEMO: ${NAP_SEED_DEMO:-1}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: nap, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: nap }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nap"], interval: 5s, retries: 20 }
    mem_limit: 768m
    logging: *logging
    networks: [core]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
    mem_limit: 192m
    logging: *logging
    networks: [core]

  # Run by the deployer before switching (`compose run --rm migrate`), never by `up`.
  migrate:
    image: ${IMAGE_BACKEND:?written by the deployer}
    profiles: [tools]
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && if [ \"$$NAP_SEED_DEMO\" = 1 ]; then python -m app.seed; fi"]
    volumes: [storage:/app/var/storage]
    mem_limit: 1g
    logging: *logging
    networks: [core]

  api:
    image: ${IMAGE_BACKEND}
    restart: unless-stopped
    environment: *backend-env
    volumes: [storage:/app/var/storage, "${STORE_ROOT:?}/backups:/backups:ro"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/ready')"], interval: 10s, retries: 10 }
    mem_limit: 768m
    logging: *logging
    networks: [core, edge]

  worker-media:
    image: ${IMAGE_BACKEND}
    restart: unless-stopped
    environment: *backend-env
    command: celery -A app.worker.celery worker -Q media --concurrency 1 --loglevel INFO
    volumes: [jobs:/app/var/jobs, storage:/app/var/storage]
    depends_on: { redis: { condition: service_healthy } }
    mem_limit: 1g
    cpus: 1.5
    logging: *logging
    networks: [core]

  worker-ops:
    image: ${IMAGE_BACKEND}
    restart: unless-stopped
    environment: *backend-env
    command: celery -A app.worker.celery worker -B -Q ops --concurrency 1 --loglevel INFO
    volumes: [storage:/app/var/storage]
    depends_on: { redis: { condition: service_healthy } }
    mem_limit: 512m
    logging: *logging
    networks: [core, edge]

  web:
    image: ${IMAGE_WEB:?written by the deployer}
    restart: unless-stopped
    environment: { BACKEND_URL: "http://api:8000", PUBLIC_BASE_URL: "https://${STORE_DOMAIN:-store.napsystem.com}", NAP_CURRENCIES: '${NAP_CURRENCIES:-["EUR","USD"]}' }
    depends_on: { api: { condition: service_healthy } }
    mem_limit: 512m
    logging: *logging
    networks: [edge]

  # TLS (Let's Encrypt, automatic) and the only public entry point.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment: { STORE_DOMAIN: "${STORE_DOMAIN:-store.napsystem.com}" }
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", caddy_data:/data, caddy_config:/config]
    depends_on: [web]
    mem_limit: 128m
    logging: *logging
    networks: [edge]

  # Daily pg_dump + restore check + retention (NAP-006), dumps in ${STORE_ROOT}/backups.
  backup:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      PG_URL: postgresql://nap:${POSTGRES_PASSWORD}@postgres:5432/nap
      PG_ADMIN_URL: postgresql://nap:${POSTGRES_PASSWORD}@postgres:5432/postgres
      BACKUP_DIR: /backups
      BACKUP_AT: ${BACKUP_AT:-23:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_STORAGE_DIR: /storage
    entrypoint: ["bash", "/ops/backup-loop.sh"]
    volumes: ["..:/ops:ro", "${STORE_ROOT}/backups:/backups", "storage:/storage:ro"]
    depends_on: { postgres: { condition: service_healthy } }
    mem_limit: 256m
    logging: *logging
    networks: [core]

networks:
  core: { internal: true }
  edge: {}

volumes: { pgdata: {}, storage: {}, jobs: {}, caddy_data: {}, caddy_config: {} }
